<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 Minutes Challenge</title>

<style>
body{
    font-family: Arial,sans-serif;
    background:linear-gradient(
    180deg,
    #fdf6f8 0%,
    #f4f6ff 100%
);
    margin:0;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    text-align:center;
}

.date{
    text-align:center;
    color:#666;
}

.progress{
    margin:20px 0;
}

.progress-bar{
    height:20px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#22c55e;
}

.exercise{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    margin:10px 0;
}

button{
    width:100%;
    border:none;
    background:#22c55e;
    color:white;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.stats{
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

#leaderboard{
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
    text-align:left;
}

#leaderboard h3{
    margin-top:0;
}

#leaderboard div{
    margin:8px 0;
    font-size:18px;
}

#streaks{
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
}

#streaks div{
    margin:8px 0;
    font-size:18px;
}
    
#fullfortIdag{
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
}

#fullfortIdag h3{
    margin-top:0;
}

#fullfortIdag div{
    margin:8px 0;
    font-size:18px;
}

#kommentarer{
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
}

#kommentarer textarea{
    width:100%;
    height:80px;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

#kommentarer button{
    margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<h1>🔥 15 Minutes Challenge</h1>

<div class="date" id="dato"></div>
<div class="date" id="brukerNavn"></div>

<div class="stats" id="stats"></div>

<div class="progress">
<div class="progress-bar">
<div id="bar" class="progress-fill"></div>
</div>
</div>

<h2 id="fokus"></h2>

<div id="ovelser"></div>

<button id="fullfortKnapp" onclick="fullfort()">
✅ Marker dagen som fullført
</button>

<p id="melding"></p>

<div id="leaderboard"></div>
<div id="streaks"></div>
<div id="fullfortIdag"></div>
<div id="kommentarer"></div>

</div>

<script>

const challenge = {

1:{fokus:"Mage",ovelser:["Sideplanke med hip lift","Super V squeeze","Sit ups"]},
2:{fokus:"Bein",ovelser:["Squats","Lunges","Wall Sit"]},
3:{fokus:"Armer",ovelser:["Push ups","Dips","Plank shoulder tap"]},
4:{fokus:"Mage",ovelser:["Cross Mountain Climbers","Russian Twist","Toe Touches"]},
5:{fokus:"Bein",ovelser:["Reverse lunges to knee","Reverse step down","Kick backs"]},
6:{fokus:"Mobilitet",ovelser:["Bird dog","Hip openers","Glute bridges","World greatest stretch"]},
7:{fokus:"Flasketrening",ovelser:["Reverse flies","Upright row","RDL"]},

8:{fokus:"Mage",ovelser:["Sideplanke med hip lift","Super V squeeze","Sit ups"]},
9:{fokus:"Bein",ovelser:["Squats","Lunges","Wall Sit"]},
10:{fokus:"Armer",ovelser:["Push ups","Dips","Plank shoulder tap"]},
11:{fokus:"Mage",ovelser:["Cross Mountain Climbers","Russian Twist","Toe Touches"]},
12:{fokus:"Bein",ovelser:["Reverse lunges to knee","Reverse step down","Kick backs"]},
13:{fokus:"Mobilitet",ovelser:["Bird dog","Hip openers","Glute bridges","World greatest stretch"]},
14:{fokus:"Flasketrening",ovelser:["Reverse flies","Upright row","RDL"]},

15:{fokus:"Mage",ovelser:["Sideplanke med hip lift","Super V squeeze","Sit ups"]},
16:{fokus:"Bein",ovelser:["Squats","Lunges","Wall Sit"]},
17:{fokus:"Armer",ovelser:["Push ups","Dips","Plank shoulder tap"]},
18:{fokus:"Mage",ovelser:["Cross Mountain Climbers","Russian Twist","Toe Touches"]},
19:{fokus:"Bein",ovelser:["Reverse lunges to knee","Reverse step down","Kick backs"]},
20:{fokus:"Mobilitet",ovelser:["Bird dog","Hip openers","Glute bridges","World greatest stretch"]},
21:{fokus:"Flasketrening",ovelser:["Reverse flies","Upright row","RDL"]},

22:{fokus:"Mage",ovelser:["Sideplanke med hip lift","Super V squeeze","Sit ups"]},
23:{fokus:"Bein",ovelser:["Squats","Lunges","Wall Sit"]},
24:{fokus:"Armer",ovelser:["Push ups","Dips","Plank shoulder tap"]},
25:{fokus:"Mage",ovelser:["Cross Mountain Climbers","Russian Twist","Toe Touches"]},
26:{fokus:"Bein",ovelser:["Reverse lunges to knee","Reverse step down","Kick backs"]},
27:{fokus:"Mobilitet",ovelser:["Bird dog","Hip openers","Glute bridges","World greatest stretch"]},
28:{fokus:"Flasketrening",ovelser:["Reverse flies","Upright row","RDL"]},

29:{fokus:"Mage",ovelser:["Sideplanke med hip lift","Super V squeeze","Sit ups"]},
30:{fokus:"Bein",ovelser:["Squats","Lunges","Wall Sit"]}
};

const dag = new Date().getDate();
let bruker = localStorage.getItem("bruker");

if(!bruker){

  bruker = prompt(
    "Hvem er du?\n\nMartine\nMaria\nSandra"
  );

  localStorage.setItem(
    "bruker",
    bruker
  );
}
    
document.getElementById("dato").innerText =
`Dagens dato: ${dag}. november`;

document.getElementById("brukerNavn").innerText =
`👤 ${bruker}`;

console.log("Aktiv bruker:", bruker);
    
if(challenge[dag]){
    document.getElementById("fokus").innerText =
    `Fokus: ${challenge[dag].fokus}`;

    challenge[dag].ovelser.forEach(o=>{
        document.getElementById("ovelser").innerHTML +=
        `<div class="exercise">☐ ${o}</div>`;
    });
}

function hentAntallFullfort(){
    let teller = 0;

    for(let i=1;i<=30;i++){
        if(localStorage.getItem("dag-"+i)){
            teller++;
        }
    }

    return teller;
}

function oppdaterProgress(){
    let fullforte = hentAntallFullfort();

    document.getElementById("stats").innerText =
    `${fullforte} av 30 dager fullført`;

    document.getElementById("bar").style.width =
    `${(fullforte/30)*100}%`;
}

async function hentLeaderboard(){

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec"
  );

  const data = await response.json();

  const score = {
    Martine:0,
    Sandra:0,
    Maria:0
  };

  data.slice(1).forEach(rad => {

    const navn = rad[0];

    if(score[navn] !== undefined){
      score[navn]++;
    }

  });

  const ranking =
    Object.entries(score)
      .sort((a,b)=>b[1]-a[1]);

  let html =
    "<h3>🏆 Leaderboard</h3>";

  ranking.forEach((person,index)=>{

    const medalje =
      ["🥇","🥈","🥉"][index];

    html +=
      `<div>${medalje} ${person[0]} - ${person[1]}</div>`;

  });

  document.getElementById(
    "leaderboard"
  ).innerHTML = html;
}

async function hentFullfortIdag(){

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec"
  );

  const data = await response.json();

  const fullforte = [];

  data.slice(1).forEach(rad => {

    const navn = rad[0];

    if(navn && !fullforte.includes(navn)){
      fullforte.push(navn);
    }

  });

  let html =
    "<h3>✅ Fullført i dag</h3>";

  ["Martine","Sandra","Maria"]
    .forEach(navn=>{

      const status =
        fullforte.includes(navn)
          ? "✅"
          : "⬜";

      html +=
        `<div>${status} ${navn}</div>`;

    });

  document.getElementById(
    "fullfortIdag"
  ).innerHTML = html;
}

async function hentStreaks(){

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec"
  );

  const data = await response.json();

  const teller = {
    Martine: 0,
    Maria: 0,
    Sandra: 0
  };

  data.slice(1).forEach(rad => {

    const navn = rad[0];

    if(
      navn &&
      teller[navn] !== undefined
    ){
      teller[navn]++;
    }

  });

  document.getElementById(
    "streaks"
  ).innerHTML = `
    <h3>🔥 Streaks</h3>

    <div>🔥 Martine - ${teller.Martine} dager</div>
    <div>🔥 Maria - ${teller.Maria} dager</div>
    <div>🔥 Sandra - ${teller.Sandra} dager</div>
  `;
}
    
async function hentKommentarer(){

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec"
  );

  const data = await response.json();
let kommentarer = "";

data.slice(1).forEach(rad => {

  const navn = rad[0];
  const kommentar = rad[3];

  if(
    kommentar &&
    kommentar.trim() !== ""
  ){

      kommentarer += `
        <div style="margin-bottom:15px">
          <strong>${navn}</strong><br>
          ${kommentar}
        </div>
      `;

  }

});

  return kommentarer;
}

function visKommentarBoks(){

  const fullfortIdag =
    localStorage.getItem("dag-"+dag);

  if(!fullfortIdag){

    document.getElementById(
      "kommentarer"
    ).innerHTML = `
      <h3>💬 Dagens kommentarer</h3>
      <p>
        Fullfør dagens challenge for å
        legge inn kommentar 😊
      </p>
    `;

    return;
  }

  document.getElementById(
    "kommentarer"
  ).innerHTML = `

    <div id="kommentarListe">
Laster kommentarer...
</div>

   <textarea
  id="kommentarTekst"
  placeholder="Hvordan gikk dagens challenge?"
></textarea>

<button onclick="lagreKommentar()">
  Lagre kommentar
</button>
  `;
}

    
function lagreKommentar(){

  const kommentar =
    document.getElementById(
      "kommentarTekst"
    ).value;

  if(!kommentar){
    alert("Skriv en kommentar først 😊");
    return;
  }

  fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec",
    {
      method:"POST",
      body:JSON.stringify({
        navn: bruker,
        dato: new Date().toISOString().split("T")[0],
        fullfort:"Ja",
        kommentar: kommentar
      })
    }
  );

  alert("💬 Kommentar lagret!");
}
    
function fullfort(){

  if(localStorage.getItem("dag-"+dag)){
    document.getElementById(
  "fullfortKnapp"
).disabled = true;

document.getElementById(
  "fullfortKnapp"
).innerText =
"✅ Registrert i dag";
    document.getElementById("melding").innerText =
    "✅ Dagen er allerede registrert.";

    return;
  }

  localStorage.setItem("dag-"+dag,"true");

  fetch(
      "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec",
      {
        method:"POST",
        body:JSON.stringify({
          navn: bruker,
          dato: new Date().toISOString().split("T")[0],
          fullfort:"Ja",
          kommentar:""
        })
      }
    );

    document.getElementById("melding").innerText =
    "🎉 Bra jobba! Dagen er registrert.";

    oppdaterProgress();
}

oppdaterProgress();
hentLeaderboard();
hentStreaks();
hentFullfortIdag();
visKommentarBoks();

hentKommentarer().then(kommentarer => {

  document.getElementById(
    "kommentarListe"
  ).innerHTML = kommentarer;

});

</script>

</body>
</html>
