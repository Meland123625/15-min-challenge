.card{

h1{

.date{

}

.profilbilde{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);

    margin-right:10px;
}

.profilbildeMini{

    height:50px;

    margin:0 8px;
}

.kommentarBoble{

@media (max-width:700px){

.topStats{

    gap:15px;

}
    
.progress{

}

.progress-bar{

}

.progress-fill{

}

.exercise{

    padding:15px;
    border-radius:10px;
    margin:10px 0;

button{

button:hover{

}

.stats{
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

#leaderboard{

    border-radius:15px;

#leaderboard h3{

#leaderboard div{

#streaks{

    padding:20px;
    border-radius:15px;

}

#streaks div{
    margin:8px 0;
    font-size:18px;

#fullfortIdag{

    padding:20px;
    border-radius:15px;
    margin:20px 0;

#fullfortIdag h3{
    margin-top:0;

#fullfortIdag div{

#kommentarer{

    padding:20px;
    border-radius:15px;
    margin:20px 0;

#kommentarer textarea{
    width:100%;
    height:80px;

    border-radius:10px;
    border:1px solid #ddd;

#kommentarer button{

}

.topStats{
    display:flex;
    gap:10px;
    margin:20px 0;
}

#leaderboard,
#streaks{
    flex:1;
}

    
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    z-index:9999;
    animation:fall 3s linear forwards;
}

    @keyframes fall{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate(-30px,25vh)
            rotate(180deg);
    }

    50%{
        transform:
            translate(40px,50vh)
            rotate(360deg);
    }

    75%{
        transform:
            translate(-20px,75vh)
            rotate(540deg);
    }

    100%{
        transform:
            translate(30px,110vh)
            rotate(720deg);
    }

}

    
</style>
</head>

async function hentStreaks(){

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzN_ktPiTSnktLe2nxQwwsWMwbmivlqjN-R0aDHjCnGH9sRlhXXjilOJGsduwa5zrWWkQ/exec"
  );

  const data = await response.json();

  const datoer = {
  Martine: [],
  Maria: [],
  Sandra: []
};

  data.slice(1).forEach(rad => {

    const navn = rad[0];
    const fullfort = rad[2];

    const dato = rad[1];

    if(
      navn &&
      fullfort === "Ja" &&
      datoer[navn] !== undefined
    ){

      const datoFormatert =
        new Date(dato)
          .toLocaleDateString("sv-SE");

      datoer[navn].push(datoFormatert);
}

  });

function beregnStreak(datoListe){

  if(datoListe.length === 0){
    return 0;
  }

  const unikeDatoer =
    [...new Set(datoListe)]
      .sort()
      .reverse();

  let streak = 1;

  for(let i = 0; i < unikeDatoer.length - 1; i++){

    const dagens =
      new Date(unikeDatoer[i]);

    const forrige =
      new Date(unikeDatoer[i+1]);

    const forskjell =
      (dagens - forrige) /
      (1000 * 60 * 60 * 24);

    if(forskjell === 1){
      streak++;
    }else{
      break;
    }

  }

  return streak;
}

const teller = {
  Martine: beregnStreak(datoer.Martine),
  Maria: beregnStreak(datoer.Maria),
  Sandra: beregnStreak(datoer.Sandra)
};

function konfetti(){

  const farger = [
    "#ff1493",
    "#ff69b4",
    "#ffd700",
    "#00c853",
    "#00b0ff"
  ];

  for(let i=0;i<150;i++){

    const bit =
      document.createElement("div");

    bit.className = "confetti";

    bit.style.left =
      Math.random()*100 + "vw";
      bit.style.width =
  (6 + Math.random()*10) + "px";

    bit.style.height =
      bit.style.width;
    
    bit.style.animationDuration =
      (2 + Math.random()*2) + "s";

    bit.style.opacity =
      0.7 + Math.random()*0.3;

    bit.style.background =
      farger[
        Math.floor(
          Math.random()*farger.length
        )
      ];

    bit.style.transform =
      `rotate(${Math.random()*360}deg)`;

    document.body.appendChild(bit);

    setTimeout(()=>{
      bit.remove();
    },3000);

  }

}
